<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Peter AI</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">


    <!-- ==========================
         SIDEBAR
    =========================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <div class="brand">

                <div class="brand-icon">
                    P
                </div>

                <span>Peter</span>

            </div>


            <button
                id="new-chat-btn"
                class="new-chat"
            >

                <i class="fa-solid fa-plus"></i>

                <span>New chat</span>

            </button>


            <nav class="sidebar-nav">

                <button id="history-btn">

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span>History</span>

                </button>


                <button id="files-btn">

                    <i class="fa-solid fa-folder"></i>

                    <span>Files</span>

                </button>


                <button id="voice-sidebar-btn">

                    <i class="fa-solid fa-microphone"></i>

                    <span>Voice</span>

                </button>


                <button id="settings-btn">

                    <i class="fa-solid fa-gear"></i>

                    <span>Settings</span>

                </button>

            </nav>

        </div>


        <!-- PROFILE -->

        <div class="profile">

            <div class="avatar">
                P
            </div>

            <div class="profile-info">

                <strong>Peter</strong>

                <span>AI Assistant</span>

            </div>

            <i class="fa-solid fa-ellipsis"></i>

        </div>

    </aside>



    <!-- ==========================
         MAIN APP
    =========================== -->

    <section class="app">


        <!-- HEADER -->

        <header>

            <div class="header-left">

                <button
                    id="menu-btn"
                    class="icon-btn"
                >

                    <i class="fa-solid fa-bars"></i>

                </button>


                <div class="model-info">

                    <div class="model-name">

                        Peter

                        <i class="fa-solid fa-chevron-down"></i>

                    </div>

                    <div class="status">

                        <span class="status-dot"></span>

                        Online

                    </div>

                </div>

            </div>


            <button
                id="theme-btn"
                class="theme-btn"
            >

                <i class="fa-solid fa-moon"></i>

            </button>

        </header>



        <!-- ==========================
             CHAT
        =========================== -->

        <main id="chat-box">

            <div class="welcome">

                <div class="welcome-icon">
                    P
                </div>

                <h1>
                    How can I help you today?
                </h1>

                <p>
                    I'm Peter, your personal AI assistant.
                </p>

            </div>


            <div class="message ai">

                <div class="bubble">

                    👋 Welcome! I'm
                    <strong>Peter</strong>.

                    <br>

                    Ask me anything and let's get started.

                </div>

            </div>

        </main>



        <!-- ==========================
             INPUT
        =========================== -->

        <footer>

            <div class="composer">

                <button
                    id="voice-btn"
                    class="composer-btn"
                    title="Voice input"
                >

                    <i class="fa-solid fa-microphone"></i>

                </button>


                <input
                    type="text"
                    id="user-input"
                    placeholder="Message Peter..."
                    autocomplete="off"
                >


                <button
                    id="send-btn"
                    class="send-btn"
                    title="Send message"
                >

                    <i class="fa-solid fa-arrow-up"></i>

                </button>

            </div>


            <p class="footer-note">

                Peter can make mistakes. Check important information.

            </p>

        </footer>


    </section>

</div>


<script src="script.js"></script>

</body>

</html>
