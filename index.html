<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Peter AI</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<div class="app">

    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-top">

            <!-- BRAND -->

            <div class="brand">

                <div class="peter-logo">

                    <div class="logo-orb">

                        <div class="logo-color purple"></div>
                        <div class="logo-color cyan"></div>
                        <div class="logo-color pink"></div>
                        <div class="logo-color green"></div>
                        <div class="logo-color blue"></div>

                        <span class="logo-letter">P</span>

                    </div>

                </div>

                <div class="brand-name">
                    Peter <span>AI</span>
                </div>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat-btn"
                id="new-chat-btn"
            >

                <i class="fa-solid fa-plus"></i>

                <span>
                    New chat
                </span>

            </button>


            <!-- NAVIGATION -->

            <nav class="sidebar-nav">

                <button
                    class="sidebar-item active"
                    id="home-btn"
                >

                    <i class="fa-solid fa-house"></i>

                    <span>
                        Home
                    </span>

                </button>


                <button
                    class="sidebar-item"
                    id="history-btn"
                >

                    <i class="fa-solid fa-clock-rotate-left"></i>

                    <span>
                        History
                    </span>

                </button>

            </nav>

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button
                class="sidebar-item"
                id="theme-btn"
            >

                <i class="fa-solid fa-moon"></i>

                <span>
                    Dark mode
                </span>

            </button>


            <div class="sidebar-user">

                <div class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="user-info">

                    <strong>
                        You
                    </strong>

                    <span>
                        Peter AI
                    </span>

                </div>

            </div>

        </div>

    </aside>


    <!-- MOBILE OVERLAY -->

    <div
        class="sidebar-overlay"
        id="sidebar-overlay"
    ></div>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="main" id="main">

        <!-- TOPBAR -->

        <header class="topbar">

            <div class="topbar-left">

                <button
                    class="menu-btn"
                    id="menu-btn"
                    title="Menu"
                >

                    <i class="fa-solid fa-bars"></i>

                </button>


                <div class="topbar-logo">

                    <div class="logo-orb mini-logo">

                        <div class="logo-color purple"></div>
                        <div class="logo-color cyan"></div>
                        <div class="logo-color pink"></div>
                        <div class="logo-color green"></div>

                        <span class="logo-letter">
                            P
                        </span>

                    </div>

                </div>


                <div class="topbar-title">
                    Peter
                </div>

            </div>


            <div class="topbar-right">

                <button
                    class="topbar-btn"
                    id="clear-btn"
                    title="Clear chat"
                >

                    <i class="fa-solid fa-trash"></i>

                </button>

            </div>

        </header>


        <!-- =====================================
             CHAT AREA
        ====================================== -->

        <section
            class="chat-area"
            id="chat-area"
        >

            <!-- WELCOME -->

            <div
                class="welcome"
                id="welcome"
            >

                <div class="welcome-logo">

                    <div class="logo-orb big-logo">

                        <div class="logo-color purple"></div>
                        <div class="logo-color cyan"></div>
                        <div class="logo-color pink"></div>
                        <div class="logo-color green"></div>
                        <div class="logo-color blue"></div>

                        <span class="logo-letter">
                            P
                        </span>

                    </div>

                </div>


                <h1>
                    Hey, I'm Peter
                </h1>


                <p>
                    Your AI assistant. Ask me anything.
                </p>


                <!-- SUGGESTIONS -->

                <div class="suggestions">

                    <button
                        class="suggestion"
                        data-prompt="Explain something interesting to me."
                    >

                        <i class="fa-solid fa-lightbulb"></i>

                        <span>
                            Teach me something
                        </span>

                    </button>


                    <button
                        class="suggestion"
                        data-prompt="Help me write something professional."
                    >

                        <i class="fa-solid fa-pen"></i>

                        <span>
                            Help me write
                        </span>

                    </button>


                    <button
                        class="suggestion"
                        data-prompt="Give me some creative ideas."
                    >

                        <i class="fa-solid fa-wand-magic-sparkles"></i>

                        <span>
                            Creative ideas
                        </span>

                    </button>


                    <button
                        class="suggestion"
                        data-prompt="Help me solve a difficult problem."
                    >

                        <i class="fa-solid fa-brain"></i>

                        <span>
                            Solve a problem
                        </span>

                    </button>

                </div>

            </div>


            <!-- MESSAGES -->

            <div
                class="messages"
                id="messages"
            ></div>

        </section>


        <!-- =====================================
             COMPOSER
        ====================================== -->

        <div
            class="composer-wrapper"
            id="composer-wrapper"
        >

            <div class="composer">

                <input
                    type="file"
                    id="file-input"
                    hidden
                    accept=".pdf,.docx,.txt,.csv,.xls,.xlsx"
                >


                <button
                    class="composer-btn"
                    id="attach-btn"
                    title="Attach file"
                >

                    <i class="fa-solid fa-paperclip"></i>

                </button>


                <textarea
                    id="message-input"
                    rows="1"
                    placeholder="Message Peter..."
                ></textarea>


                <button
                    class="composer-btn voice-btn"
                    id="voice-btn"
                    title="Voice"
                >

                    <i class="fa-solid fa-microphone"></i>

                </button>


                <button
                    class="send-btn"
                    id="send-btn"
                    title="Send"
                >

                    <i class="fa-solid fa-arrow-up"></i>

                </button>

            </div>


            <div
                class="file-preview"
                id="file-preview"
            ></div>


            <div class="composer-note">
                Peter can make mistakes. Check important information.
            </div>

        </div>


        <!-- =====================================
             SIRI VOICE MODE
        ====================================== -->

        <div
            class="voice-mode"
            id="voice-mode"
        >

            <div class="voice-background-glow"></div>


            <div class="voice-panel">

                <div class="siri-orb">

                    <div class="siri-ring ring-1"></div>
                    <div class="siri-ring ring-2"></div>
                    <div class="siri-ring ring-3"></div>

                    <div class="siri-glow"></div>


                    <div class="siri-core">

                        <div class="siri-color color-1"></div>
                        <div class="siri-color color-2"></div>
                        <div class="siri-color color-3"></div>
                        <div class="siri-color color-4"></div>

                        <i class="fa-solid fa-microphone"></i>

                    </div>

                </div>


                <div
                    class="sound-waves"
                    id="sound-waves"
                >

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="voice-status">

                    <div
                        class="voice-status-title"
                        id="voice-status-title"
                    >
                        Listening
                    </div>


                    <div
                        class="voice-status-text"
                        id="voice-status-text"
                    >
                        Speak to Peter...
                    </div>

                </div>


                <button
                    class="stop-voice-btn"
                    id="stop-voice-btn"
                >

                    <i class="fa-solid fa-xmark"></i>

                    <span>
                        End voice
                    </span>

                </button>

            </div>

        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
